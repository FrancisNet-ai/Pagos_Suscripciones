spring:
  application:
    name: platform-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # Una caída del SMTP no debe marcar la aplicación como no disponible.
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/docs/openapi.json
    enabled: ${APP_OPENAPI_ENABLED:false}
  swagger-ui:
    path: /api/docs
    enabled: ${APP_OPENAPI_ENABLED:false}
  paths-to-match: /api/v1/**

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:4200}
  time-zone: ${APP_TIME_ZONE:America/Lima}
  session:
    cookie-name: ${APP_SESSION_COOKIE_NAME:__Host-sid}
    cookie-secure: ${APP_SESSION_COOKIE_SECURE:true}
    idle-timeout: ${APP_SESSION_IDLE_TIMEOUT:PT12H}
    absolute-timeout: ${APP_SESSION_ABSOLUTE_TIMEOUT:P30D}
  password-reset:
    token-ttl: PT30M
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  mail:
    from: ${APP_MAIL_FROM:no-reply@localhost}
    log-links: false
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:./data/media}
    private-dir: ${APP_STORAGE_PRIVATE_DIR:./data/private}
  checkout:
    reservation-hold: ${APP_CHECKOUT_RESERVATION_HOLD:PT30M}
    verification-hold: ${APP_CHECKOUT_VERIFICATION_HOLD:P2D}
    order-ttl: ${APP_CHECKOUT_ORDER_TTL:P2D}
  renewals:
    token-secret: ${APP_RENEWAL_TOKEN_SECRET:}
  bootstrap:
    super-admin-email: ${APP_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
    super-admin-password: ${APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
