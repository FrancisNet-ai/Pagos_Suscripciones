name: Seguridad de dependencias

on:
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/build.gradle.kts'
      - 'backend/gradle/libs.versions.toml'
      - '.github/workflows/seguridad-dependencias.yml'
  push:
    branches: [main]
  schedule:
    # Lunes 08:17 (hora de Lima): detecta vulnerabilidades nuevas aunque no haya cambios.
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: Frontend (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
      - run: npm install -g npm@11.19.0
      # Falla con vulnerabilidades altas o críticas en lo que llega al navegador.
      - run: npm audit --omit=dev --audit-level=high

  gradle-dependency-graph:
    name: Backend (grafo de dependencias para Dependabot)
    # Envía el grafo resuelto de Gradle a GitHub para que las alertas de Dependabot
    # cubran también las dependencias transitivas del backend.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/dependency-submission@v5
        with:
          build-root-directory: backend
