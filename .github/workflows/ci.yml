name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Kotlin + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers usa el Docker que trae el runner de GitHub.
      - run: ./gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend/build/libs/app.jar
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  e2e:
    name: E2E (Playwright desktop + mobile)
    needs: [backend, frontend]
    # Evita cambios de imagen y dependencias durante la migración de ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nuvyra_e2e
          POSTGRES_USER: nuvyra
          POSTGRES_PASSWORD: ci-disposable-db-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuvyra -d nuvyra_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # Credenciales exclusivas del runner y de su base desechable; nunca se conecta a producción.
    env:
      DB_URL: jdbc:postgresql://localhost:5432/nuvyra_e2e
      DB_USER: nuvyra
      DB_PASSWORD: ci-disposable-db-only
      SPRING_PROFILES_ACTIVE: dev
      APP_PUBLIC_BASE_URL: http://localhost:4200
      APP_BOOTSTRAP_SUPER_ADMIN_EMAIL: ci-admin@example.test
      APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD: Nuvyra-ci-disposable-2026
      APP_RENEWALS_JOB_INTERVAL: PT1S
      APP_RENEWALS_JOB_INITIAL_DELAY: PT1S
      E2E_BASE_URL: http://localhost:4200
      E2E_ADMIN_EMAIL: ci-admin@example.test
      E2E_ADMIN_PASSWORD: Nuvyra-ci-disposable-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend/build/libs
      - run: npm install -g npm@11
      - run: npm ci
        working-directory: frontend
      # La imagen ubuntu-24.04 incluye Chrome y sus bibliotecas; no reinstalar fuentes/Xvfb
      # de idiomas ajenos a la interfaz española. Playwright valida las bibliotecas al lanzar.
      - run: npx playwright install --only-shell chromium
        timeout-minutes: 5
        working-directory: frontend
      - name: Iniciar aplicación y esperar disponibilidad
        run: |
          mkdir -p test-logs
          (cd backend && java -jar build/libs/app.jar) > test-logs/backend.log 2>&1 &
          (cd frontend && npm start -- --host 127.0.0.1) > test-logs/frontend.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null &&
               curl -fsS http://localhost:4200/api/v1/auth/csrf >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat test-logs/backend.log test-logs/frontend.log
          exit 1
      - run: npm run e2e
        working-directory: frontend
      - name: Conservar informe, capturas y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            test-logs
          retention-days: 7
